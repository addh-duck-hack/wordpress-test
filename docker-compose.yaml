services:
  wordpress-multisite:
    container_name: wordpress-multisite
    image: wordpress:php8.3-apache
    restart: always
    volumes:
      - wordpress_multisite_data:/var/www/html
      # Temas versionados en el repo, uno por cliente/prototipo. El resto de
      # wp-content (uploads, plugins, cache, etc.) sigue en el volumen de arriba.
      # Ruta ABSOLUTA (PROJECT_DIR, en .env) a propósito: si esto fuera relativo
      # (./wp-content/themes), "docker compose up" ejecutado desde un directorio
      # distinto al del repo monta una carpeta vacía y los temas "desaparecen".
      - ${PROJECT_DIR}/wp-content/themes:/var/www/html/wp-content/themes
      # Límites de subida de PHP (upload_max_filesize/post_max_size, etc.)
      # para la Biblioteca de medios — ver uploads.ini.
      - ${PROJECT_DIR}/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_TABLE_PREFIX: wp_
      # --- FASE 1 (primer arranque) ---
      # Deja solo WP_ALLOW_MULTISITE activo, instala WordPress normal
      # y corre el asistente "Herramientas > Configuración de red".
      # --- FASE 2 (después del asistente) ---
      # Descomenta el resto de las líneas tal cual lo indica el propio
      # asistente de WordPress (deberían coincidir con esto en una red
      # nueva) y vuelve a levantar el contenedor. Ver README.md.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ALLOW_MULTISITE', true);
        define('MULTISITE', true);
        define('SUBDOMAIN_INSTALL', true);
        define('DOMAIN_CURRENT_SITE', '${WORDPRESS_DOMAIN}');
        define('PATH_CURRENT_SITE', '/');
        define('SITE_ID_CURRENT_SITE', 1);
        define('BLOG_ID_CURRENT_SITE', 1);
    # Sin "ports": NPM llega al contenedor por nombre dentro de la red "npm",
    # igual que en peajemexico. No se expone nada al host.
    networks:
      - npm

networks:
  # Solo la red externa de Nginx Proxy Manager: por ahí llegan NPM y también el
  # MySQL compartido (mysql_db, alias "db"). La red bridge propia que había
  # (wordpress-multisite) solo tenía este contenedor y gastaba un rango del pool
  # de IPs de Docker, compartido por todos los proyectos del servidor; al
  # agotarse, `compose up` falla con "all predefined address pools have been
  # fully subnetted". Si quedó huérfana: `docker network rm wordpress-multisite`.
  npm:
    external: true

volumes:
  wordpress_multisite_data: {}
