; Límites de subida para la Biblioteca de medios de WordPress.
; Se monta en /usr/local/etc/php/conf.d/ dentro del contenedor
; (ver docker-compose.yaml). Ajusta los valores si necesitas más.
file_uploads = On
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300
